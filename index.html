<body>
  <div id="root">
    <style>
      #initial-splash {
        background-color: #ffffff;
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Inter', sans-serif;
        text-align: center;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
      }

      @media (prefers-color-scheme: dark) {
        #initial-splash {
          background-color: #0f172a;
        }

        #initial-splash h1 {
          color: #ffffff !important;
        }
      }

      #initial-splash .loader {
        width: 48px;
        height: 48px;
        border: 4px solid #e2e8f0;
        border-top-color: #2E2FCE;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 24px;
      }

      #initial-splash h1 {
        font-size: 2.25rem;
        font-weight: 900;
        color: #1e293b;
        margin: 0 0 8px 0;
        letter-spacing: -0.025em;
      }

      #initial-splash h1 span {
        color: #2E2FCE;
      }

      #initial-splash p {
        font-size: 0.75rem;
        font-weight: 600;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin: 0;
      }

      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
    <div id="initial-splash">
      <div class="loader"></div>
      <h1>Code for <span>Tomorrow</span></h1>
      <p>Warming up engines...</p>
    </div>
  </div>
  <script type="module" src="/index.tsx"></script>
</body>
